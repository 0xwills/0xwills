[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 50
fs_permissions = [{ access = "read", path = "./out-ir" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "safe-smart-account/=lib/safe-smart-account/contracts/",
]

# v5: the module is DEPLOYED from the "ir" profile (via-IR, 23.7 KB; the legacy pipeline gives 26.4 KB,
# over EIP-170). Tests run on the legacy pipeline because the Safe test dependency cannot build via IR.
# Build/deploy with: FOUNDRY_PROFILE=ir forge build --sizes  /  FOUNDRY_PROFILE=ir forge script ...
[profile.ir]
via_ir = true
out = "out-ir"
test = "no-tests"
script = "script"

[fuzz]
runs = 512

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
base_sepolia = "https://sepolia.base.org"
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
robinhood_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }

[lint]
lint_on_build = false
